<figure aria-hidden="true">
  @switch (drawing()) {
    @case ('write') {
      <svg viewBox="0 0 520 180">
        <rect x="30" y="34" width="96" height="120" rx="10" class="d-surface" />
        <path d="M98 34v28h28" class="d-line" /><text x="78" y="118" text-anchor="middle" class="d-big">ISO</text>
        <path d="M160 94h150" class="d-accent" stroke-dasharray="6 8" /><path d="M300 82l14 12-14 12" class="d-accent" />
        <rect x="344" y="66" width="120" height="56" rx="10" class="d-surface" /><rect x="464" y="78" width="30" height="32" rx="4" class="d-raised" />
        <rect x="472" y="88" width="6" height="6" class="d-fill" /><rect x="482" y="88" width="6" height="6" class="d-fill" />
        <text x="404" y="99" text-anchor="middle" class="d-small">USB</text>
      </svg>
    }
    @case ('boot') {
      <svg viewBox="0 0 520 220">
        <rect x="10" y="10" width="500" height="200" rx="12" class="d-surface" />
        <text x="40" y="50" class="d-small">{{ bootMenu() }}</text>
        <rect x="34" y="70" width="452" height="34" rx="6" class="d-raised" /><text x="48" y="92" class="d-text">Windows Boot Manager</text>
        <rect x="34" y="112" width="452" height="34" rx="6" class="d-pick" /><text x="48" y="134" class="d-pick-text">UEFI: USB Flash Disk</text>
        <rect x="34" y="154" width="452" height="34" rx="6" class="d-raised" /><text x="48" y="176" class="d-text">UEFI: Network</text>
      </svg>
    }
    @case ('firmware') {
      <svg viewBox="0 0 520 220">
        <rect x="10" y="10" width="500" height="200" rx="12" class="d-surface" />
        <rect x="10" y="10" width="500" height="40" rx="12" class="d-raised" /><text x="40" y="36" class="d-text">Main</text>
        <rect x="98" y="18" width="94" height="24" rx="5" class="d-pick" /><text x="145" y="35" text-anchor="middle" class="d-pick-text">Security</text>
        <text x="214" y="36" class="d-text">Boot</text><text x="274" y="36" class="d-text">Exit</text>
        <text x="40" y="96" class="d-text">Secure Boot</text>
        <rect x="330" y="78" width="150" height="28" rx="6" class="d-pick" /><text x="405" y="97" text-anchor="middle" class="d-pick-text">Disabled</text>
        <text x="40" y="144" class="d-text">Boot Mode</text><text x="405" y="144" text-anchor="middle" class="d-text">UEFI</text>
        <text x="40" y="186" class="d-small">F10: Save &amp; Exit</text>
      </svg>
    }
  }
</figure>
