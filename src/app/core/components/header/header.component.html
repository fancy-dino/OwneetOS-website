<header class="site">
  <nav class="wrap nav" [attr.aria-label]="i18n.t('nav.main')">
    <a class="logo" [routerLink]="i18n.path()" fragment="home" aria-label="OwneetOS"><app-wordmark /></a>

    <ul id="menu" [class.open]="menuOpen()">
      @for (link of links; track link.label) {
        <li>
          @if (link.page) {
            <a [routerLink]="i18n.pagePath(link.page)" (click)="menuOpen.set(false)"
              [attr.aria-current]="here(link) ? 'true' : null">{{ i18n.t(link.label) }}</a>
          } @else {
            <a [routerLink]="i18n.path()" [fragment]="link.section" (click)="menuOpen.set(false)"
              [attr.aria-current]="here(link) ? 'true' : null">{{ i18n.t(link.label) }}</a>
          }
        </li>
      }
    </ul>

    <div class="end">
      <div class="lang" role="group" [attr.aria-label]="i18n.t('nav.language')">
        @for (lang of i18n.languages; track lang) {
          <a [routerLink]="i18n.pagePath(sections.page(), lang)" [attr.hreflang]="lang"
            [fragment]="sections.page() === 'home' ? sections.current() : undefined"
            [attr.aria-current]="i18n.lang() === lang ? 'true' : null">{{ lang.toUpperCase() }}</a>
        }
      </div>
      <a class="btn primary small get" [routerLink]="i18n.path()" fragment="download">{{ i18n.t('nav.get') }}</a>
      <button class="menu-btn" type="button" aria-controls="menu" [attr.aria-expanded]="menuOpen()"
        (click)="menuOpen.set(!menuOpen())">
        <app-icon [name]="menuOpen() ? 'x' : 'menu'" />{{ i18n.t('nav.menu') }}
      </button>
    </div>
  </nav>
</header>
