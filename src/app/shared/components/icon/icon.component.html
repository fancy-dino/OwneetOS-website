<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
  stroke-linejoin="round" aria-hidden="true" focusable="false">
  @for (node of nodes(); track $index) {
    @let a = node[1];
    @switch (node[0]) {
      @case ('path') { <path [attr.d]="a['d']" [attr.fill]="a['fill']" /> }
      @case ('circle') { <circle [attr.cx]="a['cx']" [attr.cy]="a['cy']" [attr.r]="a['r']" [attr.fill]="a['fill']" /> }
      @case ('rect') {
        <rect [attr.x]="a['x']" [attr.y]="a['y']" [attr.width]="a['width']" [attr.height]="a['height']"
          [attr.rx]="a['rx']" [attr.ry]="a['ry']" />
      }
      @case ('line') { <line [attr.x1]="a['x1']" [attr.y1]="a['y1']" [attr.x2]="a['x2']" [attr.y2]="a['y2']" /> }
      @case ('polyline') { <polyline [attr.points]="a['points']" /> }
      @case ('polygon') { <polygon [attr.points]="a['points']" /> }
      @case ('ellipse') { <ellipse [attr.cx]="a['cx']" [attr.cy]="a['cy']" [attr.rx]="a['rx']" [attr.ry]="a['ry']" /> }
    }
  }
</svg>
