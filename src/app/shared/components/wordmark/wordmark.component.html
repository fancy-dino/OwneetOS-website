<svg [attr.viewBox]="layout().viewBox" role="img" aria-label="OwneetOS">
  <path class="accent" fill-rule="evenodd" [attr.d]="symbol.d" [attr.transform]="layout().symbol" />
  <g [attr.transform]="layout().word">
    @for (letter of letters; track $index) {
      <path [attr.d]="letter.d" [class.accent]="letter.accent" />
    }
  </g>
</svg>
