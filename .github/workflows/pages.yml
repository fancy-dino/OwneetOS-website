# SPDX-License-Identifier: GPL-3.0-or-later
# Publishes the website on GitHub Pages at every push to main (step 7.8c). Only the prerendered
# site is published, never ISOs or packages. Pages is turned on by the owner (Settings → Pages →
# Source: GitHub Actions); the "github-pages" environment only accepts main.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a publication in progress is never cancelled half-way.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The Angular CLI never sends usage statistics (also "analytics": false in angular.json).
  NG_CLI_ANALYTICS: "false"
  npm_config_update_notifier: "false"
  npm_config_fund: "false"

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install the exact dependencies of package-lock.json
        run: npm ci --no-audit
      - name: Run the unit tests
        run: npx ng test --watch=false
      - name: Build the static site under its address
        # empty on the project's domain (step 7.8h; "/OwneetOS-website" on fancy-dino.github.io);
        # the complete address goes into the canonical addresses, the languages and the sharing tags
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npx ng build --base-href "$BASE_PATH/" --define "SITE_URL='$SITE_URL'"
      - name: Make the prerendered /404 the page GitHub Pages shows for wrong addresses
        run: node scripts/not-found-page.mjs
      - name: Write sitemap.xml and robots.txt
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/sitemap.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/owneetos-website/browser

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
